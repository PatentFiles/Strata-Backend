        signal: { type: string }
        createdAt: { type: number }
        note: { type: string }
      required: [id, action, ticker, direction, signal, createdAt, note]
    History:
      type: object
      properties:
        paper: { type: array, items: { $ref: "#/components/schemas/PaperPositionInput" } }
        liveTrades: { type: array, items: { $ref: "#/components/schemas/LiveTrade" } }
        liveEvents: { type: array, items: { $ref: "#/components/schemas/LiveEvent" } }
        syncedAt: { type: number }
        metrics: { $ref: "#/components/schemas/HistoryMetrics" }
      required: [paper, liveTrades, liveEvents, syncedAt, metrics]
    HistoryMetrics:
      type: object
      description: >
        Metrics are calculated by the server from the authenticated user's
        fetched history using the dashboard's existing formulas.
      properties:
        paper: { $ref: "#/components/schemas/PaperHistoryMetrics" }
        live: { $ref: "#/components/schemas/LiveHistoryMetrics" }
      required: [paper, live]
    PaperHistoryMetrics:
      type: object
      description: >
        Paper calculations use every saved paper record. Null PnL counts as
        zero; wins have PnL greater than zero and losses have PnL less than
        or equal to zero. Monetary values are rounded to cents.
      properties:
        completed: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        cumulativePnl: { type: number }
        winRate: { type: number }
        averageWin: { type: number }
        averageLoss: { type: number }
        expectancy: { type: number }
      required: [completed, wins, losses, cumulativePnl, winRate, averageWin, averageLoss, expectancy]
    LiveHistoryMetrics:
      type: object
      description: >
        Live completed trades have closed status, non-null PnL, and non-null
        closedAt. Wins and losses use strict positive and negative PnL; the
        denominator for win rate and expectancy is all completed trades.
        Current bankroll is the $25 starting bankroll plus realized PnL less
        exposure in the first open trade, matching the dashboard formulas.
      properties:
        livePnl: { type: number }
        currentBankroll: { type: number }
        remainingBankroll: { type: number }
        exposure: { type: number }
        completedTrades: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: number }
        averageWin: { type: number }
        averageLoss: { type: number }
        expectancy: { type: number }
        maxDrawdown: { type: number }
      required: [livePnl, currentBankroll, remainingBankroll, exposure, completedTrades, wins, losses, winRate, averageWin, averageLoss, expectancy, maxDrawdown]
    LiveActionInput:
      type: object
      properties:
        trade:
          oneOf:
            - $ref: "#/components/schemas/LiveTrade"
            - type: "null"
        event: { $ref: "#/components/schemas/LiveEvent" }
      required: [trade, event]
    HistoryImportInput:
      type: object
      properties:
        paper: { type: array, items: { $ref: "#/components/schemas/PaperPosition" } }
        liveTrades: { type: array, items: { $ref: "#/components/schemas/LiveTrade" } }
        liveEvents: { type: array, items: { $ref: "#/components/schemas/LiveEvent" } }
      required: [paper, liveTrades, liveEvents]
    PaperSaveResult:
      type: object
      properties:
        inserted: { type: boolean }
      required: [inserted]
    SavedResult:
      type: object
      properties:
        saved: { type: boolean, const: true }
      required: [saved]
    HistoryImportResult:
      type: object
      properties:
        paperImported: { type: integer }
        liveImported: { type: integer }
        eventsImported: { type: integer }
      required: [paperImported, liveImported, eventsImported]

