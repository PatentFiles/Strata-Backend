name: Independent worker replay (no orders)
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/v13-production/worker.ts'
      - 'artifacts/api-server/src/lib/v13-production/*Replay*.ts'
      - 'artifacts/api-server/scripts/independent-worker-ci/**'
      - '.github/workflows/independent-worker-replay.yml'
permissions:
  contents: read
jobs:
  disposable-pg16-no-submit:
    # Keep PostgreSQL 16 host tools aligned with the existing Strata database CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 16 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Native entry, held exits and trace with no exchange capabilities
        run: |
          env -i PATH="$PATH" PG_BIN=/usr/lib/postgresql/16/bin bash \
            artifacts/api-server/scripts/independent-worker-ci/run.sh
