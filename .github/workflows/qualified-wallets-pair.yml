name: Qualified Wallets release pair
on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Exact reviewed backend commit (40 lowercase hex characters)
        required: true
        type: string
      frontend_sha:
        description: Exact reviewed Meta-UO/TradingApp commit (40 lowercase hex characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: qualified-wallets-${{ inputs.backend_sha }}-${{ inputs.frontend_sha }}
  cancel-in-progress: false
jobs:
  static-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      EXPECTED_BACKEND_SHA: ${{ inputs.backend_sha }}
      EXPECTED_FRONTEND_SHA: ${{ inputs.frontend_sha }}
    steps:
      - name: Reject mutable refs before checking out either source
        working-directory: .
        run: |
          [[ "$EXPECTED_BACKEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_FRONTEND_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: Meta-UO/TradingApp
          ref: ${{ inputs.frontend_sha }}
          path: frontend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_FRONTEND_SHA"
      - run: npm ci
      - run: node --test scripts/*.test.mjs
      - run: npm run typecheck && npm run lint && npm run build
      - run: npm run test:owner-authorization && npm run test:durable-fee-ui && npm run test:wallets-isolation
      - run: npm run test:step6 && npm run test:stake-first
      - run: node scripts/verify-bolt-publication.mjs --self-test
      - run: npx playwright install --with-deps chromium
      - name: Real browser owner onboarding and ambiguous accounting outcomes
        run: |
          node scripts/onboarding-browser/run.mjs
          node scripts/economic-browser/run.mjs
      - name: Record tested source identity without granting deployment authority
        run: |
          mkdir -p browser-evidence/qualified-pair
          node --input-type=module -e 'import{writeFileSync}from"node:fs";writeFileSync("browser-evidence/qualified-pair/static.json",JSON.stringify({backendSha:process.env.EXPECTED_BACKEND_SHA,frontendSha:process.env.EXPECTED_FRONTEND_SHA,job:"static-and-browser",passed:true,executionAuthority:"NONE"},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-wallets-static-and-browser
          path: frontend/browser-evidence/
          if-no-files-found: error
  native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
        recovery-build: [same, new]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: strata_wallets_native_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strata_wallets_native_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      NODE_ENV: test
      STRATA_ECONOMIC_EXIT_FINALITY_ENABLED: 'true'
      STRATA_TEST_RECOVERY_BUILD: ${{ matrix.recovery-build }}
      DATABASE_URL: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/strata_wallets_native_disposable
      KALSHI_API_ENVIRONMENT: production
      EXPECTED_BACKEND_SHA: ${{ inputs.backend_sha }}
      EXPECTED_FRONTEND_SHA: ${{ inputs.frontend_sha }}
    steps:
      - name: Reject mutable source refs
        working-directory: .
        run: |
          [[ "$EXPECTED_BACKEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_FRONTEND_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: Meta-UO/TradingApp
          ref: ${{ inputs.frontend_sha }}
          path: frontend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_sha }}
          path: frontend/backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Confirm actual checked out pair
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_FRONTEND_SHA"
          test "$(git -C backend rev-parse HEAD)" = "$EXPECTED_BACKEND_SHA"
      - run: npm ci
      - run: npm run test:wallets-isolation
      - run: npx playwright install --with-deps chromium
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Full disposable application schema
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/onboarding-integration/install-schema.sh
      - name: Bind exact disposable database identity
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          server_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$TEST_CONTAINER")
          [[ "$server_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "STRATA_NATIVE_CI_SERVER_HOST=$server_ip" >> "$GITHUB_ENV"
      - name: Real owner UI, restricted database role and signed synthetic venue
        run: |
          export STRATA_TEST_BACKEND_SHA=$(git -C backend rev-parse HEAD)
          cp scripts/onboarding-integration/backend.ts backend/artifacts/api-server/src/wallets-native-fixture.ts
          cd backend/artifacts/api-server
          pnpm exec esbuild src/wallets-native-fixture.ts --bundle --platform=node --format=cjs --outfile=dist/wallets-native-fixture.cjs --external:pg-native --external:pdfjs-dist --external:pdfjs-dist/* --external:pino --external:pino-pretty
          node ../../../scripts/onboarding-integration/launch.mjs dist/wallets-native-fixture.cjs > "$RUNNER_TEMP/wallets-native-backend.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/wallets-native-backend.log"' EXIT
          cd ../../..
          node --require ./scripts/onboarding-integration/network-fence.cjs scripts/onboarding-integration/run-lifecycle.mjs
          node --input-type=module -e 'import{writeFileSync}from"node:fs";writeFileSync("browser-evidence/native/qualified-pair.json",JSON.stringify({backendSha:process.env.EXPECTED_BACKEND_SHA,frontendSha:process.env.EXPECTED_FRONTEND_SHA,recoveryBuild:process.env.STRATA_TEST_RECOVERY_BUILD,passed:true,executionAuthority:"NONE"},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-wallets-native-pg${{ matrix.postgres }}-${{ matrix.recovery-build }}
          path: frontend/browser-evidence/native/
          if-no-files-found: error
