name: Final entry wire clock safety
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/entryWireClock*'
      - 'artifacts/api-server/src/lib/strata/personalExecutionSupervisor.ts'
      - 'artifacts/api-server/src/lib/v13-production/ledger.ts'
      - 'artifacts/api-server/src/lib/v13-production/transactionConnectionFence*'
      - 'artifacts/api-server/src/lib/v13-production/executor.ts'
      - '.github/workflows/entry-wire-clock.yml'
      # Requalify the native pg/pg-pool private-state contract on upgrades.
      - 'pnpm-lock.yaml'
      - 'lib/db/package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  late-fee-verification:
    # Pin native PostgreSQL tooling compatibility; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/entryWireClock.test.ts --bundle --platform=node --format=cjs --outfile=dist/entry-wire-clock.cjs
          node --test dist/entry-wire-clock.cjs
      - name: Verify transaction-owned disconnect fence
        working-directory: artifacts/api-server
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
          NODE_ENV: test
        run: |
          pnpm exec esbuild src/lib/v13-production/transactionConnectionFence.test.ts --bundle --platform=node --format=cjs --outfile=dist/transaction-connection-fence.cjs --external:pg-native
          node --test dist/transaction-connection-fence.cjs
      - name: Install isolated PostgreSQL tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          sudo systemctl stop postgresql
      - name: Verify native disconnect refusal and healthy pool reuse
        working-directory: artifacts/api-server
        run: node scripts/run-v13-disposable-postgres.mjs src/lib/v13-production/transactionConnectionFence.postgres.test.ts
