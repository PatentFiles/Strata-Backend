name: First-party Kalshi tariff evidence parser

# Tariff parser tests remain automatic for the actual parser and dependencies.
on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/lib/strata/officialTariffHtmlObservation*'
      - 'artifacts/api-server/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/strata-first-party-tariff.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/lib/strata/officialTariffHtmlObservation*'
      - 'artifacts/api-server/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/strata-first-party-tariff.yml'
  workflow_dispatch:

# Cancel superseded PR checks; never cancel an in-progress mainline safety run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail-closed issuer HTML completeness and identity tests (NO network/orders)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/officialTariffHtmlObservation.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/officialTariffHtmlObservation.test.cjs
          node --test dist/officialTariffHtmlObservation.test.cjs
