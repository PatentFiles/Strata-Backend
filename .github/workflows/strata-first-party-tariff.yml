name: First-party Kalshi tariff evidence parser

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail-closed issuer HTML completeness and identity tests (NO network/orders)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/officialTariffHtmlObservation.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/officialTariffHtmlObservation.test.cjs
          node --test dist/officialTariffHtmlObservation.test.cjs
