name: Continuous grant candidate safety
on:
  push:
    branches: [fix/continuous-grant-revocation-fences-20261027]
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/userScopeDatabase*'
      - 'artifacts/api-server/src/lib/strata/walletDisplayReads*'
      - 'artifacts/api-server/src/lib/strata/continuousExecutionAuthorization*'
      - 'lib/db/drizzle/0043_strata_continuous_execution_grants.sql'
      - 'lib/db/drizzle/0044_v13_signal_decision_trace.sql'
      - '.github/workflows/continuous-grant-safety.yml'
      - 'artifacts/api-server/src/lib/forwardTestCadence*'
      - 'artifacts/api-server/src/lib/forwardTestFeedValidation*'
      - 'artifacts/api-server/src/lib/forwardTestWorker.ts'
      - 'artifacts/api-server/src/lib/forwardTestFeeds*'
      - 'artifacts/api-server/src/lib/v13-production/executor.ts'
      - 'artifacts/api-server/src/lib/v13-production/entryQuoteEvidence*'
      - 'artifacts/api-server/src/lib/v13-production/ledger.ts'
      - 'artifacts/api-server/src/lib/strata/personalExecutionSupervisor.ts'
      - 'artifacts/api-server/src/lib/strata/entryWireClock*'
      - 'artifacts/api-server/src/lib/v13-production/acceptance.test.ts'
      - 'docs/reviews/maintenance-hardening-20261028.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-grant-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Install isolated embedded PostgreSQL test engine
        run: npm install --prefix "$RUNNER_TEMP/strata-test-deps" --ignore-scripts @electric-sql/pglite@0.5.12
      - name: Grant SQL and worker recovery regressions (no exchange credentials)
        working-directory: artifacts/api-server
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
          NODE_ENV: test
        run: |
          pnpm exec esbuild src/lib/strata/continuousExecutionAuthorization.postgres.test.ts src/lib/strata/continuousExecutionAuthorization.test.ts src/lib/v13-production/workerProtectiveRecovery.test.ts src/lib/v13-production/signalDecisionTrace.test.ts --bundle --platform=node --format=cjs --outdir=dist/standing-tests --out-extension:.js=.cjs --external:pg-native --external:@electric-sql/pglite
          NODE_PATH="$RUNNER_TEMP/strata-test-deps/node_modules" node --test dist/standing-tests/strata/*.cjs dist/standing-tests/v13-production/*.cjs
      - name: Verify mandatory LIVE entry evidence and actual producer digest compatibility
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/v13-production/entryQuoteEvidence.test.ts --bundle --platform=node --format=cjs --outfile=dist/entry-quote-evidence.cjs
          node --test dist/entry-quote-evidence.cjs
      - name: Protective exit failure and restart tests
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
          NODE_ENV: test
        run: |
          cd artifacts/api-server
          pnpm exec esbuild src/lib/strata/ownerFeeEmergencyExit*.test.ts src/lib/strata/technicalReleaseEntryGate.test.ts src/lib/strata/protectiveExitStartupRelease.test.ts src/lib/strata/personalExchangeProtectiveSnapshot.test.ts src/lib/strata/personalExecution.test.ts src/lib/strata/walletV4CommissioningReadiness.test.ts --bundle --platform=node --format=cjs --outdir=dist/recovery-review --out-extension:.js=.cjs --external:pg-native --external:pdfjs-dist --external:pino --external:pino-pretty
          cd ../..
          node --test artifacts/api-server/dist/recovery-review/*.cjs
  full-disposable-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install local disposable PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          sudo systemctl stop postgresql
      - name: Complete existing safety suite in a new credential-isolated local cluster
        run: node artifacts/api-server/scripts/run-v13-disposable-postgres.mjs --full-suite
  standing-transactions-and-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: standing_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real PostgreSQL races, crash tracing and local latency budget
        working-directory: artifacts/api-server
        env:
          DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/standing_ci
          STRATA_ISOLATED_STANDING_TEST: 'true'
          NODE_ENV: test
        run: |
          pnpm exec esbuild src/lib/strata/standingExecutionConcurrency.postgres.test.ts --bundle --platform=node --format=cjs --outfile=dist/standing-concurrency.cjs --external:pg-native
          node --test dist/standing-concurrency.cjs
