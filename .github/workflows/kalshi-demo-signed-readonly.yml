name: Kalshi demo-only signed GET proof
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/kalshiDemoSignedReadOnly*'
      - 'artifacts/api-server/src/lib/strata/kalshiDemoAuthenticatedProbe*'
      - 'artifacts/api-server/src/lib/strata/kalshiDemoSignedIoc*'
      - 'artifacts/api-server/src/lib/strata/kalshiDemoIocLedger*'
      - 'artifacts/api-server/src/lib/strata/kalshiDemoIocQualification*'
      - 'sql/strata_demo_ioc_private.sql'
      - 'artifacts/api-server/src/scripts/runKalshiDemoAuthenticatedGet.ts'
      - '.github/workflows/kalshi-demo-signed-readonly.yml'
  push:
    branches:
      - main
    paths:
      - 'artifacts/api-server/src/lib/strata/kalshiDemoSignedReadOnly*'
      - 'artifacts/api-server/src/lib/strata/kalshiDemoAuthenticatedProbe*'
      - 'artifacts/api-server/src/lib/strata/kalshiDemoSignedIoc*'
      - 'artifacts/api-server/src/lib/strata/kalshiDemoIocLedger*'
      - 'artifacts/api-server/src/lib/strata/kalshiDemoIocQualification*'
      - 'sql/strata_demo_ioc_private.sql'
      - 'artifacts/api-server/src/scripts/runKalshiDemoAuthenticatedGet.ts'
      - '.github/workflows/kalshi-demo-signed-readonly.yml'
  workflow_dispatch:
# Cancel superseded PR checks; never cancel an in-progress mainline safety run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  demo-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub DEMO private key scope
        # Regression guard: no untrusted dependency install/build step sees secrets.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/kalshi-demo-authenticated-get.yml").read_text()
          marker = "      - name: Execute one demo balance GET and emit redacted status"
          before, found, final_step = workflow.partition(marker)
          assert found, "Read-only DEMO execution step is missing"
          assert "environment: kalshi-demo" in before
          for secret in ("STRATA_DEMO_KALSHI_KEY_ID", "STRATA_DEMO_KALSHI_PRIVATE_KEY_PEM"):
              assert "secrets." + secret not in before, "DEMO secret exposed outside GET step"
              assert "secrets." + secret in final_step, "DEMO execution secret missing"
          assert "node artifacts/api-server/dist/runKalshiDemoAuthenticatedGet.cjs" in final_step
          print("DEMO credentials are scoped to the final signed GET only.")
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Bundle demo-only signature and transport-denial tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/kalshiDemoSignedReadOnly.test.ts --bundle --platform=node --format=cjs --outfile=dist/kalshiDemoSignedReadOnly.test.cjs
      - name: Verify signatures and fail-closed GET scope
        run: node --test artifacts/api-server/dist/kalshiDemoSignedReadOnly.test.cjs
      - name: Bundle authenticated demo GET transport tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/kalshiDemoAuthenticatedProbe.test.ts --bundle --platform=node --format=cjs --outfile=dist/kalshiDemoAuthenticatedProbe.test.cjs
      - name: Verify no-retry, redacted demo GET evidence
        run: node --test artifacts/api-server/dist/kalshiDemoAuthenticatedProbe.test.cjs

      - name: Bundle signed DEMO IOC one-shot tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/kalshiDemoSignedIoc.test.ts --bundle --platform=node --format=cjs --outfile=dist/kalshiDemoSignedIoc.test.cjs
      - name: Test signed DEMO IOC fencing, no-retry, partial fills and fail closed
        run: node --test artifacts/api-server/dist/kalshiDemoSignedIoc.test.cjs

      - name: Bundle private DEMO IOC ledger transition tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/kalshiDemoIocLedger.test.ts --bundle --platform=node --format=cjs --outfile=dist/kalshiDemoIocLedger.test.cjs
      - name: Test DEMO IOC PREPARED to UNKNOWN and terminal records without retries
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/kalshiDemoIocLedger.test.cjs

      - name: Bundle integrated DEMO lifecycle tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/kalshiDemoIocQualification.test.ts --bundle --platform=node --format=cjs --outfile=dist/kalshiDemoIocQualification.test.cjs
      - name: Test DEMO full prepare, UNKNOWN, POST, read and terminal durability
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/kalshiDemoIocQualification.test.cjs
