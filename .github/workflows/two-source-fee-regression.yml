name: KXBTC15M two-source fee preflight regression

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/twoSourceFeeEvidence*'
      - 'artifacts/api-server/src/lib/strata/feeFailureDiagnostics*'
      - 'artifacts/api-server/src/lib/strata/apiFeePolicyReviewCandidate*'
      - 'artifacts/api-server/src/lib/strata/apiFeeSourceStage*'
      - 'artifacts/api-server/src/lib/v13-production/stageTiming*'
      - 'artifacts/api-server/src/lib/strata/gatherReadOnlyMarketEvidence*'
      - 'artifacts/api-server/src/lib/strata/marketEvidenceReadTiming*'
      - 'artifacts/api-server/src/lib/strata/entryMetadataSnapshot*'
      - 'artifacts/api-server/src/lib/strata/publicMetadataReadRateLimit*'
      - 'artifacts/api-server/src/lib/readOnlyRateLimit*'
      - 'artifacts/api-server/src/lib/strata/ownedMarketFeeMetadata*'
      - 'artifacts/api-server/src/lib/strata/personalExecutionSupervisor.ts'
      - 'artifacts/api-server/src/lib/strata/step6ApiFeeObservation*'
      - 'artifacts/api-server/src/routes/userExecutionRouter.ts'
      - '.github/workflows/two-source-fee-regression.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/lib/strata/twoSourceFeeEvidence*'
      - 'artifacts/api-server/src/lib/strata/feeFailureDiagnostics*'
      - 'artifacts/api-server/src/lib/strata/apiFeePolicyReviewCandidate*'
      - 'artifacts/api-server/src/lib/strata/apiFeeSourceStage*'
      - 'artifacts/api-server/src/lib/v13-production/stageTiming*'
      - 'artifacts/api-server/src/lib/strata/gatherReadOnlyMarketEvidence*'
      - 'artifacts/api-server/src/lib/strata/marketEvidenceReadTiming*'
      - 'artifacts/api-server/src/lib/strata/entryMetadataSnapshot*'
      - 'artifacts/api-server/src/lib/strata/publicMetadataReadRateLimit*'
      - 'artifacts/api-server/src/lib/readOnlyRateLimit*'
      - 'artifacts/api-server/src/lib/strata/ownedMarketFeeMetadata*'
      - 'artifacts/api-server/src/lib/strata/personalExecutionSupervisor.ts'
      - 'artifacts/api-server/src/lib/strata/step6ApiFeeObservation*'
      - 'artifacts/api-server/src/routes/userExecutionRouter.ts'
      - '.github/workflows/two-source-fee-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fail-closed-market-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Bundle deterministic read-only Kalshi API fee tests
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/twoSourceFeeEvidence.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/twoSourceFeeEvidence.test.cjs
      - name: Execute positive, changed-fee and API-failure regression tests
        run: node artifacts/api-server/dist/twoSourceFeeEvidence.test.cjs
      - name: Bundle Step 6 API-only fallback fail-closed tests
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/step6ApiFeeObservation.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/step6ApiFeeObservation.test.cjs
      - name: Reject stale, mismatched or authorizing API fee observations
        run: node --test artifacts/api-server/dist/step6ApiFeeObservation.test.cjs
      - name: Bundle dependency scheduling and exact-market metadata tests
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/gatherReadOnlyMarketEvidence.test.ts src/lib/strata/ownedMarketFeeMetadata.test.ts src/lib/strata/marketEvidenceReadTiming.test.ts src/lib/strata/entryMetadataSnapshot.test.ts src/lib/strata/publicMetadataReadRateLimit.test.ts src/lib/strata/feeFailureDiagnostics.test.ts \
            --bundle --platform=node --format=cjs --outdir=dist/evidence-dag --out-extension:.js=.cjs
      - name: Verify bounded fresh reads, fail-closed identity and pagination
        run: node --test artifacts/api-server/dist/evidence-dag/*.cjs
      - name: Preserve existing read-only Retry-After parsing contracts
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/readOnlyRateLimit.test.ts --bundle --platform=node --format=cjs --outfile=dist/read-only-rate-limit.cjs
          node --test artifacts/api-server/dist/read-only-rate-limit.cjs
