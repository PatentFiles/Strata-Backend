name: ChatGPT V13 diagnostics

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v13_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v13_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/v13_ci
      NODE_ENV: test
      GITHUB_ACTIONS: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Verify legacy global account never selects an owned account
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/v13-production/legacyGlobalAccountSelector.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/legacyGlobalAccountSelector.test.cjs \
            --external:pg-native --external:drizzle-orm --external:drizzle-orm/* \
            --external:pino --external:pino-pretty
          node --test dist/legacyGlobalAccountSelector.test.cjs
      - name: Verify PAPER_ONLY producer startup flags and policy approval (no exchange)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/forwardTestStartupGate.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/forwardTestStartupGate.test.cjs
          node --test dist/forwardTestStartupGate.test.cjs
      - name: Test default-disabled owner variable funding transport and monetary precision
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/ownerVariableTopup.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/ownerVariableTopup.test.cjs \
            --external:pg-native --external:drizzle-orm --external:drizzle-orm/* \
            --external:pino --external:pino-pretty
          node --test dist/ownerVariableTopup.test.cjs
      - name: Owner-scoped funding maintenance preflight (GET-only; no transfer)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/ownerFundingMaintenanceReadiness.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/ownerFundingMaintenanceReadiness.test.cjs
          node --test dist/ownerFundingMaintenanceReadiness.test.cjs
      - name: Regression - commissioned account cannot retain provisional freeze
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/commissioningFreezeTransition.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/commissioningFreezeTransition.test.cjs \
            --external:pg-native --external:drizzle-orm --external:drizzle-orm/* \
            --external:pdfjs-dist --external:pdfjs-dist/*
          node --test dist/commissioningFreezeTransition.test.cjs
      - name: Verify KXBTC15M CF Benchmarks settlement-index shadow (NO ORDERS)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/cfBenchmarksSettlement.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/cfBenchmarksSettlement.test.cjs
          node --test dist/cfBenchmarksSettlement.test.cjs
      - name: Verify BRTI shadow observer remains disabled without explicit production enablement
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/kalshiBrtiShadowStream.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/kalshiBrtiShadowStream.test.cjs \
            --external:pino --external:pino-pretty
          node --test dist/kalshiBrtiShadowStream.test.cjs
      - name: Validate V13 research-only execution stress, depth and outlier model (NO ORDERS)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/v13ResearchExecutionStress.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/v13ResearchExecutionStress.test.cjs
          node --test dist/v13ResearchExecutionStress.test.cjs
      - name: Validate read-only Kalshi complementary orderbook and capacity modeling (NO ORDERS)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/forwardTestOrderbookDepth.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/forwardTestOrderbookDepth.test.cjs
          node --test dist/forwardTestOrderbookDepth.test.cjs
      - name: Audit hypothetical paper P&L, 333-contract capacity outlier and missing-depth uncertainty
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/forwardTestExecutionAudit.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/forwardTestExecutionAudit.test.cjs
          node --test dist/forwardTestExecutionAudit.test.cjs
      - name: Test paper strategy execution semantics
        run: |
          pnpm --filter @workspace/api-server exec esbuild ../btc-paper-dashboard/src/lib/strategy.self-test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=/tmp/v13-strategy-self-test.cjs
          node /tmp/v13-strategy-self-test.cjs
          pnpm --filter @workspace/api-server exec esbuild ../btc-paper-dashboard/src/lib/strategy.parity-test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=/tmp/v13-strategy-parity-test.cjs
          node /tmp/v13-strategy-parity-test.cjs
      - name: Build workspace
        run: pnpm run build
      - name: Initialize disposable database schema
        run: pnpm --filter @workspace/db run push
      - name: Test API and forward-test integration
        working-directory: artifacts/api-server
        run: pnpm test
      - name: Test Kalshi account and trading clients
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/kalshiAccountClient.test.ts             --bundle --platform=node --format=cjs             --outfile=dist/kalshiAccountClient.test.cjs
          node --test dist/kalshiAccountClient.test.cjs
          pnpm exec esbuild src/lib/kalshiTradingClient.test.ts             --bundle --platform=node --format=cjs             --outfile=dist/kalshiTradingClient.test.cjs             --external:pg-native --external:drizzle-orm --external:drizzle-orm/*
          node --test dist/kalshiTradingClient.test.cjs
      - name: Test owner-only DEMO IOC with one-shot UNKNOWN and independent reconciliation (offline only)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/kalshiDemoSignedIoc.test.ts --bundle --platform=node --format=cjs --outfile=dist/kalshiDemoSignedIoc.test.cjs
          node --test dist/kalshiDemoSignedIoc.test.cjs
      - name: Test owner-authenticated DEMO ledger qualification (no funded orders)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/kalshiDemoIocQualification.test.ts --bundle --platform=node --format=cjs --outfile=dist/kalshiDemoIocQualification.test.cjs
          node --test dist/kalshiDemoIocQualification.test.cjs
      - name: Test API-first Step 6 without PDF and no approval authority
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/step6ApiFeeObservation.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/step6ApiFeeObservation.test.cjs
          node --test dist/step6ApiFeeObservation.test.cjs
      - name: Validate fixed-origin PDF-free official fee HTML capture (NO authorization)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/providerFeePageCapture.test.ts --bundle --platform=node --format=cjs --outfile=dist/providerFeePageCapture.test.cjs
          node --test dist/providerFeePageCapture.test.cjs
      - name: Verify fixed-origin Kalshi fee webpage and live exact-market API crosscheck (NO trade authority)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/pdfFreeProviderFeeCrosscheck.test.ts --bundle --platform=node --format=cjs --outfile=dist/pdfFreeProviderFeeCrosscheck.test.cjs
          node --test dist/pdfFreeProviderFeeCrosscheck.test.cjs
      - name: Audit four protective-exit outcomes, timeout and no duplicate POST (NO live exchange)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/ownerFeeEmergencyExitEvidenceAudit.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitEvidenceAudit.test.cjs
          node --test dist/ownerFeeEmergencyExitEvidenceAudit.test.cjs
      - name: Verify integer quadratic reference vectors (review-only)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/apiFeeRateReference.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/apiFeeRateReference.test.cjs
          node --test dist/apiFeeRateReference.test.cjs
      - name: Validate API-source schema on isolated disposable PGlite
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/apiFeeSourceMigration.postgres.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/apiFeeSourceMigration.postgres.test.cjs
          node --test dist/apiFeeSourceMigration.postgres.test.cjs
      - name: Guard Step 9/11/order API source integration and empty migration
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/apiFeePolicyIntegration.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/apiFeePolicyIntegration.test.cjs
          node --test dist/apiFeePolicyIntegration.test.cjs
      - name: Verify final reviewed-API fee order POST fence (no live orders)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/guardedReviewedApiFeeWire.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/guardedReviewedApiFeeWire.test.cjs
          node --test dist/guardedReviewedApiFeeWire.test.cjs
      - name: Test DB-backed reviewed API fee stage and exact-market refusal
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/apiFeeSourceStage.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/apiFeeSourceStage.test.cjs
          node --test dist/apiFeeSourceStage.test.cjs
      - name: Verify admin-only runtime database attestation (read-only, no credentials)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/apiFeeRuntimeDbIdentity.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/apiFeeRuntimeDbIdentity.test.cjs
          node --test dist/apiFeeRuntimeDbIdentity.test.cjs
      - name: Test authenticated API fee model review, grants, owner consent and revocation
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/apiFeeHumanApprovals.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/apiFeeHumanApprovals.test.cjs \
            --external:pg-native --external:drizzle-orm --external:drizzle-orm/* \
            --external:pdfjs-dist --external:pdfjs-dist/*
          node --test dist/apiFeeHumanApprovals.test.cjs
      - name: Test two-independent-reviewer API grant eligibility (no authority)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/apiFeeGrantEligibility.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/apiFeeGrantEligibility.test.cjs
          node --test dist/apiFeeGrantEligibility.test.cjs
      - name: Validate PDF-free API fee review candidate (NO approval authority)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/apiFeePolicyReviewCandidate.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/apiFeePolicyReviewCandidate.test.cjs \
            --external:pdfjs-dist --external:pdfjs-dist/*
          node --test dist/apiFeePolicyReviewCandidate.test.cjs
      - name: Test personal event/series fee changes and stale/override refusal
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/ownedMarketFeeMetadata.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownedMarketFeeMetadata.test.cjs
          node --test dist/ownedMarketFeeMetadata.test.cjs
      - name: Test V13 production and micro-live safety suites
        working-directory: artifacts/api-server
        run: pnpm run test:v13-safety-all
      - name: Test owned V2 policy, frontend contracts and multi-user isolation
        working-directory: artifacts/api-server
        run: |
          pnpm run test:personal-execution
          if ! command -v initdb >/dev/null && ! test -x /usr/lib/postgresql/16/bin/initdb; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-16
          fi
          node scripts/run-v13-disposable-postgres.mjs src/lib/strata/personalExecution.integration.test.ts
      - name: Test private owner fee-source grant and consent readiness
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/operatorFeeAuthorizationReadiness.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/operatorFeeAuthorizationReadiness.test.cjs \
            --external:pg-native --external:drizzle-orm --external:drizzle-orm/*
          node --test dist/operatorFeeAuthorizationReadiness.test.cjs
      - name: Test explicit operator fee-source authorization refusal and scope
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/operatorFeeSourceAuthorization.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/operatorFeeSourceAuthorization.test.cjs
          node --test dist/operatorFeeSourceAuthorization.test.cjs
      - name: Test disabled-by-default automatic cashier sweep safeguards
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/autoProfitWithdrawals.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/autoProfitWithdrawals.test.cjs \
            --external:pg-native --external:pdfjs-dist --external:pino --external:pino-pretty
          node --test dist/autoProfitWithdrawals.test.cjs
      - name: Test cross-key Kalshi balance quota and fail-closed reads
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/kalshiBalanceQuota.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/kalshiBalanceQuota.test.cjs \
            --external:pg-native --external:pdfjs-dist
          node --test dist/kalshiBalanceQuota.test.cjs
      - name: Test strict automatic restart refusal after kill or manual interruption
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/autoWithdrawalMaintenance.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/autoWithdrawalMaintenance.test.cjs \
            --external:pg-native --external:pdfjs-dist --external:pino --external:pino-pretty
          node --test dist/autoWithdrawalMaintenance.test.cjs
      - name: Test owner pilot transfer one-shot safety and isolation
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/ownedPilotTransfer.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownedPilotTransfer.test.cjs
          node --test dist/ownedPilotTransfer.test.cjs
          pnpm exec esbuild src/lib/strata/ownedPilotTransfer.postgres.test.ts --bundle --platform=node --format=cjs --external:@electric-sql/pglite --outfile=dist/ownedPilotTransfer.postgres.test.cjs
          node --test dist/ownedPilotTransfer.postgres.test.cjs
      - name: Test owner-shard 0 to 2 allocation and one-shot safety
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/ownerShardAllocation.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerShardAllocation.test.cjs
          node --test dist/ownerShardAllocation.test.cjs
          pnpm exec esbuild src/lib/strata/ownerShardAllocation.postgres.test.ts --bundle --platform=node --format=cjs --external:@electric-sql/pglite --outfile=dist/ownerShardAllocation.postgres.test.cjs
          node --test dist/ownerShardAllocation.postgres.test.cjs
      - name: Test $5-$25000 strict owner stake presets and serialized policy approval
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/strictPresetStake.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/strictPresetStake.test.cjs \
            --external:pg-native --external:drizzle-orm --external:drizzle-orm/*
          node --test dist/strictPresetStake.test.cjs
          pnpm exec esbuild src/lib/strata/ownerStakePolicyAmendment.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/ownerStakePolicyAmendment.test.cjs \
            --external:pg-native --external:drizzle-orm --external:drizzle-orm/*
          node --test dist/ownerStakePolicyAmendment.test.cjs
      - name: Test proportional risk presets and owner isolation
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/sharedPresets.test.ts --bundle --platform=node --format=cjs --outfile=dist/sharedPresets.test.cjs
          node --test dist/sharedPresets.test.cjs
          pnpm run test:v13-user-scope
      - name: Test index-2 provisioning route
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/routes/pairKeyProvisioning.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/pairKeyProvisioning.test.cjs \
            --external:pg-native --external:drizzle-orm --external:drizzle-orm/* \
            --external:@clerk/express --external:express
          node --test dist/pairKeyProvisioning.test.cjs
      - name: Test common fee contract fail-closed behavior
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/monetaryFeeContract.test.ts --bundle --platform=node --format=cjs --outfile=dist/monetaryFeeContract.test.cjs
          node --test dist/monetaryFeeContract.test.cjs
      - name: Test monetary fee final signed-order lock and rollback
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/guardedMonetaryFeeWire.test.ts --bundle --platform=node --format=cjs --outfile=dist/guardedMonetaryFeeWire.test.cjs --external:pg-native --external:drizzle-orm --external:drizzle-orm/*
          node --test dist/guardedMonetaryFeeWire.test.cjs
      - name: Test authenticated owner monetary policy approval
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/personalOwnerMonetaryApproval.test.ts --bundle --platform=node --format=cjs --outfile=dist/personalOwnerMonetaryApproval.test.cjs --external:pg-native --external:drizzle-orm --external:drizzle-orm/* --external:pdfjs-dist
          node --test dist/personalOwnerMonetaryApproval.test.cjs
      - name: Test Step 11 owner monetary commissioning consent
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/personalOwnerMonetaryCommission.test.ts --bundle --platform=node --format=cjs --outfile=dist/personalOwnerMonetaryCommission.test.cjs --external:pg-native --external:drizzle-orm --external:drizzle-orm/* --external:pdfjs-dist
          node --test dist/personalOwnerMonetaryCommission.test.cjs
      - name: Verify independently observed official PDF snapshot and immutable 24h lease
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/microLiveFeeOfficialSnapshot.test.ts --bundle --platform=node --format=cjs --outfile=dist/microLiveFeeOfficialSnapshot.test.cjs --external:pdfjs-dist --external:pdfjs-dist/*
          node --test dist/microLiveFeeOfficialSnapshot.test.cjs
