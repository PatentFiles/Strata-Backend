name: Legacy fee authority final-send locks
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/apiFeeStandingDelegation*'
      - 'artifacts/api-server/src/lib/strata/apiFeeSourceStage*'
      - 'artifacts/api-server/src/lib/strata/guardedReviewedApiFeeWire*'
      - 'artifacts/api-server/src/lib/strata/legacyFeeAuthorityLocks.offline.ts'
      - 'artifacts/api-server/scripts/test-legacy-fee-locks.sh'
      - '.github/workflows/legacy-fee-authority-locks.yml'
permissions:
  contents: read
jobs:
  legacy-authority-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Legacy stage and final signed-wire regression
        working-directory: artifacts/api-server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
        run: |
          pnpm exec esbuild src/lib/strata/apiFeeStandingDelegation.test.ts src/lib/strata/apiFeeSourceStage.test.ts src/lib/strata/guardedReviewedApiFeeWire.test.ts --bundle --platform=node --format=cjs --outdir=dist/legacy-lock-tests --out-extension:.js=.cjs --external:pg-native --external:pino --external:pino-pretty --external:pdfjs-dist
          node --test dist/legacy-lock-tests/*.cjs
      - name: Original-schema PostgreSQL final transaction revocation locks
        env:
          PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: bash artifacts/api-server/scripts/test-legacy-fee-locks.sh
