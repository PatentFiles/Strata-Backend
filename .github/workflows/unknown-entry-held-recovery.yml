name: Acknowledged entry held recovery
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/**'
      - 'artifacts/api-server/scripts/*unknown-entry*'
      - 'artifacts/api-server/scripts/unknownEntryRecoveryPostgresLifecycle.mjs'
      - 'artifacts/api-server/package.json'
      - 'lib/db/**'
      - 'sql/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/unknown-entry-held-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-and-native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - name: Verify fail-closed held recovery with no network
        run: pnpm --filter @workspace/api-server run test:unknown-entry-held-recovery
      - name: Install disposable PostgreSQL tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Verify native hold and competing writers in fresh Unix-only cluster
        run: pnpm --filter @workspace/api-server run test:unknown-entry-held-recovery-postgres
