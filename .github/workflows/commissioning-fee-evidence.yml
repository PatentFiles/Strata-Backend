name: Commissioning fee evidence diagnostics
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/commissioningFeeEvidenceDiagnostic.ts'
      - 'artifacts/api-server/src/lib/strata/ownerFiveGateReleaseAudit.ts'
      - 'artifacts/api-server/src/lib/strata/ownerFiveGateReleaseAudit.test.ts'
      - 'artifacts/api-server/src/lib/strata/ownerAccountOnboardingReadiness.ts'
      - 'artifacts/api-server/src/lib/strata/ownerAccountOnboardingReadiness.test.ts'
      - 'artifacts/api-server/src/lib/strata/ownerApiFeePolicyMigration.ts'
      - 'artifacts/api-server/src/lib/strata/ownerApiFeePolicyMigration.test.ts'
      - 'artifacts/api-server/src/lib/strata/ownerSignedExchangeReleaseProof.ts'
      - 'artifacts/api-server/src/lib/strata/ownerSignedExchangeReleaseProof.test.ts'
      - 'artifacts/api-server/src/lib/strata/ownerV4CommissioningRepair.ts'
      - 'artifacts/api-server/src/lib/strata/ownerV4CommissioningRepair.test.ts'
      - 'artifacts/api-server/src/lib/strata/isolatedIssuerFeeSourceStatus.ts'
      - 'artifacts/api-server/src/lib/strata/isolatedIssuerFeeSourceStatus.test.ts'
      - 'artifacts/api-server/src/routes/userExecutionRouter.ts'
      - '.github/workflows/commissioning-fee-evidence.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/twoSourceFeeEvidence.test.ts --bundle --platform=node --format=cjs --outfile=dist/twoSourceFeeEvidence.test.cjs
      - run: node artifacts/api-server/dist/twoSourceFeeEvidence.test.cjs
      - name: Verify all five owner release evidence gates fail closed with no Kalshi requests or orders
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFiveGateReleaseAudit.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFiveGateReleaseAudit.test.cjs --external:pg-native --external:pdfjs-dist --external:pdfjs-dist/*
          DATABASE_URL=postgres://isolated:isolated@127.0.0.1:5432/never_connect node artifacts/api-server/dist/ownerFiveGateReleaseAudit.test.cjs
      - name: Validate all account-setup states without modifying financial records
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerAccountOnboardingReadiness.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerAccountOnboardingReadiness.test.cjs --external:pg-native --external:pdfjs-dist --external:pdfjs-dist/*
          DATABASE_URL=postgres://isolated:isolated@127.0.0.1:5432/never_connect node artifacts/api-server/dist/ownerAccountOnboardingReadiness.test.cjs
      - name: Verify owner fee-policy migration preflight truth, expiry, and MFA-safe release
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerApiFeePolicyMigration.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerApiFeePolicyMigration.test.cjs --external:pg-native --external:pdfjs-dist --external:pdfjs-dist/*
          DATABASE_URL=postgres://isolated:isolated@127.0.0.1:5432/never_connect node artifacts/api-server/dist/ownerApiFeePolicyMigration.test.cjs
      - name: Verify owner signed Kalshi preflight never grants financial authority
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerSignedExchangeReleaseProof.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerSignedExchangeReleaseProof.test.cjs --external:pg-native --external:pdfjs-dist --external:pdfjs-dist/*
          DATABASE_URL=postgres://isolated:isolated@127.0.0.1:5432/never_connect node artifacts/api-server/dist/ownerSignedExchangeReleaseProof.test.cjs
      - name: Verify V4 owner issuer-backed repair never bypasses signed flatness or kill switch
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerV4CommissioningRepair.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerV4CommissioningRepair.test.cjs --external:pg-native --external:pdfjs-dist --external:pdfjs-dist/*
          DATABASE_URL=postgres://isolated:isolated@127.0.0.1:5432/never_connect node artifacts/api-server/dist/ownerV4CommissioningRepair.test.cjs
      - name: Audit isolated issuer PDF source without fetching or granting trading permission
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/isolatedIssuerFeeSourceStatus.test.ts --bundle --platform=node --format=cjs --outfile=dist/isolatedIssuerFeeSourceStatus.test.cjs --external:pg-native --external:pdfjs-dist --external:pdfjs-dist/*
          DATABASE_URL=postgres://isolated:isolated@127.0.0.1:5432/never_connect node artifacts/api-server/dist/isolatedIssuerFeeSourceStatus.test.cjs
