name: Commissioning fee evidence diagnostics
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/commissioningFeeEvidenceDiagnostic.ts'
      - 'artifacts/api-server/src/lib/strata/ownerFiveGateReleaseAudit.ts'
      - 'artifacts/api-server/src/lib/strata/ownerFiveGateReleaseAudit.test.ts'
      - 'artifacts/api-server/src/routes/userExecutionRouter.ts'
      - '.github/workflows/commissioning-fee-evidence.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/twoSourceFeeEvidence.test.ts --bundle --platform=node --format=cjs --outfile=dist/twoSourceFeeEvidence.test.cjs
      - run: node artifacts/api-server/dist/twoSourceFeeEvidence.test.cjs
      - name: Verify all five owner release evidence gates fail closed with no Kalshi requests or orders
        run: |
          pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFiveGateReleaseAudit.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFiveGateReleaseAudit.test.cjs --external:pg-native --external:pdfjs-dist --external:pdfjs-dist/*
          node artifacts/api-server/dist/ownerFiveGateReleaseAudit.test.cjs
