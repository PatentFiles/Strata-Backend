name: Kalshi canonical PDF provenance probe (read only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/kalshi-fee-evidence-probe.yml

permissions:
  contents: read

jobs:
  verify-canonical-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only official Kalshi PDF and compare with owner-provided fixture
        id: verify
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, urllib.request, urllib.error
          URL = "https://kalshi.com/docs/kalshi-fee-schedule.pdf"
          FILE = pathlib.Path("attached_assets/0_kalshi-fee-schedule_1790474920034.pdf")
          EXPECTED = "c326a69f596a11e8f8be2620402d39a8d4823920c21cc97c93a114d862699601"
          OUTPUT = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          SUMMARY = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          def result(ok, reason, digest=None):
              with OUTPUT.open("a") as output:
                  output.write(f"verified={'true' if ok else 'false'}\n")
              with SUMMARY.open("a") as summary:
                  summary.write("### Official Kalshi fee PDF — independent byte provenance\n")
                  summary.write(f"Status: **{'VERIFIED' if ok else 'NOT VERIFIED'}**. Reason: `{reason}`\n\n")
                  if digest: summary.write(f"Observed source SHA-256: `{digest}`\n\n")
                  summary.write("This is only source evidence. No policy approval, funds or trading controls change.\n")
              print("VERIFIED" if ok else f"NOT VERIFIED: {reason}")
          if not FILE.is_file() or hashlib.sha256(FILE.read_bytes()).hexdigest() != EXPECTED:
              result(False,"owner_fixture_missing_or_modified")
              raise SystemExit(0)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(URL,headers={
              "Accept":"application/pdf",
              "Cache-Control":"no-cache",
              "User-Agent":"Strata-Fee-Provenance-ReadOnly/1.0"
          })
          try:
              with urllib.request.build_opener(NoRedirect).open(request,timeout=18) as response:
                  if response.status != 200 or response.geturl() != URL:
                      result(False,"non_200_or_redirected_source")
                      raise SystemExit(0)
                  media_type = response.headers.get("Content-Type","").split(";")[0].strip().lower()
                  if media_type != "application/pdf":
                      result(False,"canonical_content_type_invalid")
                      raise SystemExit(0)
                  body = response.read(2_000_001)
          except urllib.error.HTTPError as exc:
              result(False, f"official_http_{exc.code}")
              raise SystemExit(0)
          except Exception:
              result(False,"official_source_network_unavailable")
              raise SystemExit(0)
          if not 100 < len(body) <= 2_000_000 or not body.startswith(b"%PDF-") or b"%%EOF" not in body[-2048:]:
              result(False,"canonical_pdf_invalid")
              raise SystemExit(0)
          digest=hashlib.sha256(body).hexdigest()
          if digest != EXPECTED:
              result(False,"official_bytes_differ_from_owner_fixture",digest)
              raise SystemExit(0)
          output=pathlib.Path("kalshi-canonical-capture")
          output.mkdir(exist_ok=True)
          (output/"official.pdf").write_bytes(body)
          receipt={
              "source":URL,"sha256":digest,"byte_length":len(body),
              "captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workflow_sha":os.getenv("GITHUB_SHA"),"provenance":"GitHub-hosted runner pinned canonical source"
          }
          (output/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          result(True,"canonical_bytes_match_owner_fixture",digest)
          PY
      - name: Upload independently matched PDF and machine-readable receipt
        if: steps.verify.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-official-source-capture
          path: kalshi-canonical-capture/
          retention-days: 1
          if-no-files-found: error
