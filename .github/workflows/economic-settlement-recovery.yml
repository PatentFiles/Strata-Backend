name: Economic settlement accounting recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/lib/strata/ownerEconomicSettlement*'
      - 'artifacts/api-server/src/lib/strata/accountCredentialControls.ts'
      - 'artifacts/api-server/src/lib/strata/reconciledReleaseRenewalHistory.ts'
      - 'artifacts/api-server/src/lib/strata/settledCashBracket.ts'
      - 'artifacts/api-server/src/lib/v13-production/ledger.ts'
      - 'artifacts/api-server/src/routes/ownerEconomicSettlement*'
      - 'artifacts/api-server/src/routes/userExecutionRouter.ts'
      - 'artifacts/api-server/scripts/run-economic-settlement-tests.mjs'
      - 'supabase/migrations/*economic_settlement*'
      - '.github/workflows/economic-settlement-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-economic-accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Offline signed-evidence and authenticated route regressions
        working-directory: artifacts/api-server
        run: pnpm run test:economic-settlement
      - name: Install disposable PostgreSQL binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql-${{ matrix.postgres }}
      - name: Native transaction, RLS, UNKNOWN, duplication and cancellation races
        working-directory: artifacts/api-server
        env:
          STRATA_ECONOMIC_PG_VERSION: ${{ matrix.postgres }}
        run: pnpm run test:economic-settlement-native
      - run: pnpm --filter @workspace/api-server run build
