name: Frozen restricted credential recovery

on:
  push:
    branches:
      - fix/frozen-restricted-key-recovery-20261026
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/api-server/src/lib/strata/accountCredential*"
      - "artifacts/api-server/src/lib/strata/technicalSetupAdvance*"
      - "artifacts/api-server/src/lib/strata/credentialFixtureDb.testHelper.ts"
      - "artifacts/api-server/src/lib/strata/accountPhase5.test.ts"
      - "artifacts/api-server/src/routes/userExecutionRouter.ts"
      - "artifacts/api-server/src/lib/strata/frozenRestrictedCredentialRecovery.ts"
      - ".github/workflows/frozen-restricted-credential-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Disposable CI-only service; never use a deployed database secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strata_setup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d strata_setup_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/strata_setup_ci
      NODE_ENV: test
      CI: "true"
      STRATA_CREDENTIAL_NATIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production entry containment (no exchange)
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/v13-production/liveEntryContainment.test.ts --bundle --platform=node --format=cjs --outfile=dist/liveEntryContainment.test.cjs
          node --test dist/liveEntryContainment.test.cjs
      - name: Typecheck
        run: pnpm run typecheck
      - name: Credential store regression and isolated database tests
        working-directory: artifacts/api-server
        run: pnpm run test:account-credential-store
      - name: Credential lifecycle (revoke, recover, verify) and isolated database tests
        working-directory: artifacts/api-server
        run: pnpm run test:account-credential-lifecycle

      - name: Technical commissioning bootstrap and bounded resume regressions
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/strata/accountPhase5.test.ts --bundle --platform=node --format=cjs --outfile=dist/accountPhase5.test.cjs --external:pg-native --external:pdfjs-dist --external:pino --external:pino-pretty
          node --test dist/accountPhase5.test.cjs
