name: Frozen restricted credential recovery

on:
  push:
    branches:
      - fix/frozen-restricted-key-recovery-20261026
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/api-server/src/lib/strata/accountCredential*"
      - "artifacts/api-server/src/lib/strata/frozenRestrictedCredentialRecovery.ts"
      - ".github/workflows/frozen-restricted-credential-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Credential store regression and isolated database tests
        working-directory: artifacts/api-server
        run: pnpm run test:account-credential-store
      - name: Credential lifecycle (revoke, recover, verify) and isolated database tests
        working-directory: artifacts/api-server
        run: pnpm run test:account-credential-lifecycle
