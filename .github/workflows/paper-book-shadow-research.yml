name: Paper book shadow research
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/paperBookExpectedCoverage*'
      - 'artifacts/api-server/src/lib/forwardTestBookCapture.ts'
      - 'artifacts/api-server/src/lib/forwardTestOrderbookDepth.ts'
      - 'artifacts/api-server/src/routes/forwardTest.ts'
      - 'artifacts/api-server/scripts/run-v13-disposable-postgres.mjs'
      - 'artifacts/api-server/package.json'
      - 'lib/db/**'
      - 'research/entry-exit-shadow-20261109/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/paper-book-shadow-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting-and-offline-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server run typecheck
      - name: Test bounded reporting orchestration
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/lib/paperBookExpectedCoverage.test.ts --bundle --platform=node --format=cjs --outfile=dist/paperBookExpectedCoverage.test.cjs
          node --test dist/paperBookExpectedCoverage.test.cjs
      - name: Test synthetic entry and exit shadow research
        working-directory: research/entry-exit-shadow-20261109
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -v
      - name: Install PostgreSQL tooling for a new disposable cluster
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Test real SQL matching, caps, isolation and receipt constraints
        run: node artifacts/api-server/scripts/run-v13-disposable-postgres.mjs src/lib/paperBookExpectedCoverage.postgres.test.ts
