name: Validate isolated protective-exit SQL ledgers
on:
  pull_request:
    paths:
      - 'sql/strata_demo_ioc_private.sql'
      - 'sql/strata_emergency_exit_reservation_private.sql'
      - 'sql/tests/strata_exit_private_test.sql'
      - '.github/workflows/protective-exit-ledger-sql.yml'
  push:
    branches: [main]
    paths:
      - 'sql/strata_demo_ioc_private.sql'
      - 'sql/strata_emergency_exit_reservation_private.sql'
      - 'sql/tests/strata_exit_private_test.sql'
      - '.github/workflows/protective-exit-ledger-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create disposable Supabase-compatible fixtures
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE SCHEMA private;
          CREATE TABLE public.v13_production_account(id text PRIMARY KEY);
          SQL
      - name: Apply both isolated private ledgers to disposable DB
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/strata_demo_ioc_private.sql
          psql -v ON_ERROR_STOP=1 -f sql/strata_emergency_exit_reservation_private.sql
      - name: Verify RLS, private grants, one-shot states, and uniqueness
        run: psql -v ON_ERROR_STOP=1 -f sql/tests/strata_exit_private_test.sql
