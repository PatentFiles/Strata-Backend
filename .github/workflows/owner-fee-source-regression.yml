name: Operator fee-source authorization and final-order regression
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/operatorFee*'
      - 'artifacts/api-server/src/lib/strata/twoSourceFeeEvidence*'
      - 'artifacts/api-server/src/lib/strata/apiFeeRateReference*'
      - 'artifacts/api-server/src/lib/strata/ownerFee*'
      - 'artifacts/api-server/src/lib/strata/legacyOfficialFeeCaptureGate*'
      - 'artifacts/api-server/src/lib/strata/commissioningStore.ts'
      - 'artifacts/api-server/src/lib/strata/guardedOwnerFeeWire*'
      - 'artifacts/api-server/src/lib/strata/personalAccountActivation.ts'
      - 'artifacts/api-server/src/lib/strata/personalPolicyApproval.ts'
      - 'artifacts/api-server/src/lib/strata/personalExecutionSupervisor.ts'
      - 'artifacts/api-server/src/lib/strata/workerUncertainOrderGate*'
      - 'artifacts/api-server/src/routes/userExecutionRouter.ts'
      - 'sql/strata_fee_source_policy_independent_reviews.sql'
      - 'sql/strata_emergency_exit_reservation_private.sql'
      - '.github/workflows/owner-fee-source-regression.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Bundle legacy official fee capture fail-closed tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/legacyOfficialFeeCaptureGate.test.ts --bundle --platform=node --format=cjs --outfile=dist/legacyOfficialFeeCaptureGate.test.cjs
      - name: Reject legacy verified flags without matching provider fee capture
        run: node --test artifacts/api-server/dist/legacyOfficialFeeCaptureGate.test.cjs
      - name: Bundle stage tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeSourceStage.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeSourceStage.test.cjs
      - name: Run stage negative cases
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeSourceStage.test.cjs
      - name: Bundle final POST tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/guardedOwnerFeeWire.test.ts --bundle --platform=node --format=cjs --outfile=dist/guardedOwnerFeeWire.test.cjs
      - name: Run POST denial and protective exits
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/guardedOwnerFeeWire.test.cjs
      - name: Bundle owner consent and revocation isolation tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeSourceConsent.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeSourceConsent.test.cjs
      - name: Test owner consent UUIDs, isolation, duplicate prevention and revocation
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeSourceConsent.test.cjs
      - name: Bundle unresolved-intent worker-start guard
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/workerUncertainOrderGate.test.ts --bundle --platform=node --format=cjs --outfile=dist/workerUncertainOrderGate.test.cjs
      - name: Test worker fail-closed behavior for unverified intent counts
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/workerUncertainOrderGate.test.cjs
      - name: Bundle emergency exit read-only verification tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExit.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExit.test.cjs
      - name: Test expired grant recovery evidence and zero-authority fail-closed cases
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExit.test.cjs
      - name: Bundle exact-market emergency fee proof tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitMarket.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitMarket.test.cjs
      - name: Test exact named Kalshi market lifecycle and override rejection
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitMarket.test.cjs
      - name: Bundle offline end-to-end emergency recovery simulations
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitDryRun.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitDryRun.test.cjs
      - name: Test offline recovery without transport, authority or retry
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitDryRun.test.cjs
      - name: Bundle read-only IOC fill and uncertain-response reconciliation tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitReconcile.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitReconcile.test.cjs
      - name: Test zero/partial/full and UNKNOWN IOC recovery without retries
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitReconcile.test.cjs
      - name: Bundle advisory emergency exit reservation tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitReserve.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitReserve.test.cjs
      - name: Test worker-fenced no-trade reservation and duplicate denial
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitReserve.test.cjs
      - name: Bundle authenticated emergency-exit read tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitRead.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitRead.test.cjs
      - name: Test emergency recovery scoped reads and isolation
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitRead.test.cjs
      - name: Bundle six-decimal fee and partial-fill conservative bound tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/apiFeeRateReference.test.ts --bundle --platform=node --format=cjs --outfile=dist/apiFeeRateReference.test.cjs
      - name: Test fee price, precision, and split-fill upper bounds
        run: node --test artifacts/api-server/dist/apiFeeRateReference.test.cjs
      - name: Bundle official API fee metadata diagnostic tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/twoSourceFeeEvidence.test.ts --bundle --platform=node --format=cjs --outfile=dist/twoSourceFeeEvidence.test.cjs
      - name: Test official-series identity, fee changes and non-authorizing API evidence
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/twoSourceFeeEvidence.test.cjs
      - name: Bundle exact policy digest test
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/operatorFeePolicyDecision.test.ts --bundle --platform=node --format=cjs --outfile=dist/operatorFeePolicyDecision.test.cjs
      - name: Validate pinned human policy approval decision hash
        run: node --test artifacts/api-server/dist/operatorFeePolicyDecision.test.cjs
      - name: Bundle purely offline protective-exit recovery phase tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitRecoveryFence.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitRecoveryFence.test.cjs
      - name: Validate no-trade UNKNOWN and no-retry recovery transitions
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitRecoveryFence.test.cjs
      - name: Bundle worker-fenced durable UNKNOWN commit review tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitUnknownCommit.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitUnknownCommit.test.cjs
      - name: Verify committed UNKNOWN before any transport and no retry authorization
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitUnknownCommit.test.cjs
      - name: Bundle isolated sandbox IOC lifecycle proof tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitSandboxCycle.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitSandboxCycle.test.cjs
      - name: Validate sandbox-only zero/partial/full-fill and uncertain responses
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitSandboxCycle.test.cjs
      - name: Bundle version-bound one-shot protective IOC dispatch tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitSignedDispatch.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitSignedDispatch.test.cjs
      - name: Test durable UNKNOWN before signed one-shot, isolated fills and no blind retry
        run: NODE_ENV=test DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitSignedDispatch.test.cjs
      - name: Bundle independently scoped protective-exit recovery history tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitAuthenticatedRecovery.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitAuthenticatedRecovery.test.cjs
      - name: Validate immutable baseline, full scoped fills and fail-closed recovery
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitAuthenticatedRecovery.test.cjs
      - name: Bundle transactionally audited protective exit reconciliation tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitReconciliationCommit.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitReconciliationCommit.test.cjs
      - name: Test committed terminal state, duplicate prevention and ambiguity handling
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitReconciliationCommit.test.cjs
      - name: Bundle restart reconciliation no-submit orchestration tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitRestartRecovery.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitRestartRecovery.test.cjs
      - name: Test restart signed history and irreversible one-use audited recovery
        run: NODE_ENV=test DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitRestartRecovery.test.cjs
      - name: Bundle authenticated full-state position history query tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/personalExchangePositionQuery.test.ts --bundle --platform=node --format=cjs --outfile=dist/personalExchangePositionQuery.test.cjs
      - name: Test Kalshi complete market position query
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/personalExchangePositionQuery.test.cjs
      - name: Bundle immutable protective worker recovery tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitWorkerRecovery.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitWorkerRecovery.test.cjs
      - name: Test immutable worker protective recovery snapshots
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable NODE_ENV=test node --test artifacts/api-server/dist/ownerFeeEmergencyExitWorkerRecovery.test.cjs
      - name: Bundle worker recovery ordering tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/v13-production/workerProtectiveRecovery.test.ts --bundle --platform=node --format=cjs --outfile=dist/workerProtectiveRecovery.test.cjs
      - name: Verify protected recovery happens before V13 execution
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable NODE_ENV=test node --test artifacts/api-server/dist/workerProtectiveRecovery.test.cjs
      - name: Bundle trusted owned protective IOC cutover tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/ownerFeeEmergencyExitWorkerDispatch.test.ts --bundle --platform=node --format=cjs --outfile=dist/ownerFeeEmergencyExitWorkerDispatch.test.cjs
      - name: Test owned signed protective exit cutover
        run: NODE_ENV=test DATABASE_URL=postgresql://test:test@127.0.0.1:5432/unreachable node --test artifacts/api-server/dist/ownerFeeEmergencyExitWorkerDispatch.test.cjs
