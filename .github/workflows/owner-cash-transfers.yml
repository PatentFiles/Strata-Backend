name: Owner cash transfer safety
on:
  pull_request:
    branches: [main]
    paths: ['artifacts/api-server/src/lib/strata/**','artifacts/api-server/src/lib/v13-production/ledger.ts','supabase/migrations/*owner_cash_flow*','artifacts/api-server/package.json','.github/workflows/owner-cash-transfers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-cash-transfers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Offline cash-floor and transport regressions
        working-directory: artifacts/api-server
        run: pnpm run test:owner-cash-transfers
      - name: Install selected isolated PostgreSQL tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.postgres }}
          sudo systemctl stop postgresql
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - name: Verify selected PostgreSQL binary
        run: |
          test "$(command -v postgres)" = "/usr/lib/postgresql/${{ matrix.postgres }}/bin/postgres"
          postgres --version
          postgres --version | grep -E 'PostgreSQL\) ${{ matrix.postgres }}\.'
      - name: Native transaction, RLS, UNKNOWN, duplication and cancellation races
        working-directory: artifacts/api-server
        env:
          STRATA_ECONOMIC_PG_VERSION: ${{ matrix.postgres }}
        run: pnpm run test:owner-cash-transfers-native
      - run: pnpm --filter @workspace/api-server run build

