name: Operator attested fee eligibility safety
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/strata/operatorAttestedFeeEligibility*'
      - '.github/workflows/operator-attested-fee-eligibility.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/lib/strata/operatorAttestedFeeEligibility*'
      - '.github/workflows/operator-attested-fee-eligibility.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Bundle candidate validation tests
        run: pnpm --filter @workspace/api-server exec esbuild src/lib/strata/operatorAttestedFeeEligibility.test.ts --bundle --platform=node --format=cjs --outfile=dist/operatorAttestedFeeEligibility.test.cjs
      - run: node --test artifacts/api-server/dist/operatorAttestedFeeEligibility.test.cjs
